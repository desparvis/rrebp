{% extends "base.html" %}

{% block title %}Set New Password | RREBP{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 2rem; background-color: #F9FAFB;">
    
    <div style="background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 450px; border: 1px solid #E5E7EB;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.5rem; color: #059669; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 style="font-size: 1.5rem; color: #111827; margin: 0 0 0.5rem 0;">Create New Password</h2>
            <p style="color: #6B7280; font-size: 0.95rem; margin: 0;">Your identity has been verified. Please enter your new secure password below.</p>
        </div>

        <form action="{{ url_for('landing.reset_password', token=token) }}" method="POST" style="display: flex; flex-direction: column; gap: 1.25rem;">
            
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="password" style="font-size: 0.9rem; font-weight: 600; color: #374151;">New Password</label>
                <input type="password" name="password" id="password" required minlength="8" placeholder="At least 8 characters" 
                       style="padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 6px; font-family: inherit; font-size: 0.95rem;">
            </div>
            
            <button type="submit" style="background-color: #059669; color: white; padding: 0.85rem; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s;">
                Update Password
            </button>
            
        </form>
        
    </div>

</div>
{% endblock %}
