{% extends "base.html" %}

{% block title %}Login & Registration | RREBP{% endblock %}

{% block content %}
<!-- Link to the specific CSS for this page -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth_portal.css') }}">

<div class="auth-container">
    <div class="auth-card">
        
        <!-- Tabs -->
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')">Sign In</div>
            <div class="auth-tab" onclick="switchTab('register')">Register / Apply</div>
        </div>

        <div class="auth-body">
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="flash-msg">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- LOGIN FORM -->
            <form action="/login" method="POST" id="loginForm" class="auth-form active">
                <input type="hidden" name="form_type" value="login">
                
                <div class="form-group">
                    <label for="login_role">I am logging in as:</label>
                    <select id="login_role" name="role" required>
                        <option value="broker">Real Estate Broker</option>
                        <option value="association">Association Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="login_email">Email Address</label>
                    <input type="email" id="login_email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="login_password">Password</label>
                    <input type="password" id="login_password" name="password" required>
                </div>

                <button type="submit" class="btn-primary" style="padding: 0.85rem; font-size: 1rem;">Sign In</button>
            </form>

            <!-- REGISTER FORM -->
            <form action="/login" method="POST" id="registerForm" class="auth-form">
                <input type="hidden" name="form_type" value="register">

                <div class="form-group">
                    <label for="register_role">I want to register as:</label>
                    <select id="register_role" name="role" onchange="toggleRegistrationFields()" required>
                        <option value="broker">Real Estate Broker</option>
                        <option value="association">Association Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="register_name">Full Name</label>
                    <input type="text" id="register_name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="register_email">Email Address</label>
                    <input type="email" id="register_email" name="email" required>
                </div>

                <!-- Dynamic Field: Shows only for Brokers -->
                <div class="form-group" id="broker_field">
                    <label for="license_number">Broker License Number</label>
                    <input type="text" id="license_number" name="license_number">
                </div>

                <!-- Dynamic Field: Shows only for Associations -->
                <div class="form-group" id="association_field" style="display: none;">
                    <label for="association_name">Association / Organization Name</label>
                    <input type="text" id="association_name" name="association_name">
                </div>

                <div class="form-group">
                    <label for="register_password">Create Password</label>
                    <input type="password" id="register_password" name="password" required>
                </div>

                <button type="submit" class="btn-primary" style="padding: 0.85rem; font-size: 1rem;">Submit Application</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Switches between Login and Register Tabs
    function switchTab(tabName) {
        // Reset tabs
        document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));

        // Activate selected tab
        if (tabName === 'login') {
            document.querySelectorAll('.auth-tab')[0].classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            document.querySelectorAll('.auth-tab')[1].classList.add('active');
            document.getElementById('registerForm').classList.add('active');
        }
    }

    // Dynamically shows/hides fields based on the chosen role during registration
    function toggleRegistrationFields() {
        const role = document.getElementById('register_role').value;
        const brokerField = document.getElementById('broker_field');
        const assocField = document.getElementById('association_field');

        if (role === 'broker') {
            brokerField.style.display = 'flex';
            assocField.style.display = 'none';
        } else {
            brokerField.style.display = 'none';
            assocField.style.display = 'flex';
        }
    }
</script>
{% endblock %}
