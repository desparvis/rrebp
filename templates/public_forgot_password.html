{% extends "base.html" %}

{% block title %}Forgot Password | RREBP{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 2rem; background-color: #F9FAFB;">
    
    <div style="background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 450px; border: 1px solid #E5E7EB;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.5rem; color: #0A66C2; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 style="font-size: 1.5rem; color: #111827; margin: 0 0 0.5rem 0;">Reset Your Password</h2>
            <p style="color: #6B7280; font-size: 0.95rem; margin: 0;">Enter your email and we will send you a secure link to reset your password.</p>
        </div>

        <form action="{{ url_for('landing.forgot_password') }}" method="POST" style="display: flex; flex-direction: column; gap: 1.25rem;">
            
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="role" style="font-size: 0.9rem; font-weight: 600; color: #374151;">Account Type</label>
                <select name="role" id="role" required style="padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 6px; font-family: inherit; font-size: 0.95rem;">
                    <option value="" disabled selected>Select your role...</option>
                    <option value="broker">Broker</option>
                    <option value="association">Association Admin</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="email" style="font-size: 0.9rem; font-weight: 600; color: #374151;">Email Address</label>
                <input type="email" name="email" id="email" required placeholder="Enter your registered email" 
                       style="padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 6px; font-family: inherit; font-size: 0.95rem;">
            </div>
            
            <button type="submit" style="background-color: #0A66C2; color: white; padding: 0.85rem; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s;">
                Send Reset Link
            </button>
            
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{{ url_for('landing.login_portal') }}" style="color: #0A66C2; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                &larr; Back to Login
            </a>
        </div>
        
    </div>

</div>
{% endblock %}
