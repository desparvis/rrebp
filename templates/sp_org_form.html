{% extends "sp_base.html" %}

{% block title %}{{ 'Edit' if org else 'Add' }} Organization | Super Admin{% endblock %}

{% block content %}
<style>
    .form-card {
        background-color: var(--bg-white);
        padding: 2rem;
        border-radius: 6px;
        border: 1px solid var(--border-grey);
        max-width: 600px;
    }
    .form-group {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
    }
    .form-group label {
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text-dark);
    }
    .form-group input, .form-group select {
        padding: 0.75rem;
        border: 1px solid var(--border-grey);
        border-radius: 4px;
        font-family: 'Inter', sans-serif;
    }
</style>

<div class="admin-header">
    <h1>{{ 'Edit Organization' if org else 'Register New Organization' }}</h1>
    <a href="{{ url_for('superadmin.organizations') }}" class="btn-primary" style="background-color: #6B7280;">Back to List</a>
</div>

<div class="form-card">
    <form action="{{ url_for('superadmin.edit_organization', org_id=org.id) if org else url_for('superadmin.new_organization') }}" method="POST">
        
        <div class="form-group">
            <label for="name">Organization Name</label>
            <input type="text" id="name" name="name" value="{{ org.name if org else '' }}" required>
        </div>

        <div class="form-group">
            <label for="registration_number">Official Registration Number</label>
            <input type="text" id="registration_number" name="registration_number" value="{{ org.registration_number if org else '' }}" required>
        </div>

        <div class="form-group">
            <label for="email">Contact Email</label>
            <input type="email" id="email" name="email" value="{{ org.email if org else '' }}" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" value="{{ org.phone if org else '' }}" required>
        </div>

        <div class="form-group">
            <label for="address">Physical Address</label>
            <input type="text" id="address" name="address" value="{{ org.address if org else '' }}">
        </div>

        {% if org %}
        <div class="form-group">
            <label for="status">Account Status</label>
            <select id="status" name="status">
                <option value="Active" {% if org.status == 'Active' %}selected{% endif %}>Active</option>
                <option value="Suspended" {% if org.status == 'Suspended' %}selected{% endif %}>Suspended</option>
            </select>
        </div>
        {% endif %}

        <button type="submit" class="btn-primary" style="padding: 0.75rem 1.5rem;">
            {{ 'Save Changes' if org else 'Register Organization' }}
        </button>
    </form>
</div>
{% endblock %}
