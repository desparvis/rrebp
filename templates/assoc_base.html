<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Organization Dashboard | RREBP{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- We can reuse the admin_style.css since the layout structure is identical! -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_style.css') }}">
</head>
<body>
    
    <div class="admin-layout">
        <!-- Side Navigation -->
        <aside class="admin-sidebar" style="background-color: #1F2937;"> <!-- Slightly lighter dark for Assoc Admins -->
            <a href="/assocdash" class="logo">RREBP Organization</a>
            <nav class="admin-nav">
                <a href="/assocdash" class="{% if request.path == '/assocdash' %}active{% endif %}"><i class="fa-solid fa-chart-pie"></i> Overview</a>
                <a href="/assocdash/brokers" class="{% if 'brokers' in request.path %}active{% endif %}"><i class="fa-solid fa-id-card-clip"></i> Manage Brokers</a>
                <a href="/assocdash/logout" style="margin-top: auto;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="admin-main">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
